name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.10.1'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative'
          cache: 'true'

      # mark2haru is left to the FetchContent fallback, so the job builds
      # against its master and reports a provider break here rather than at
      # the next release.
      - name: Configure CMake
        run: |
          cmake -B build -S briefutil \
            -DBRIEFUTIL_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config ${CMAKE_BUILD_TYPE} --parallel

      - name: Run tests
        run: ctest --test-dir build -C ${CMAKE_BUILD_TYPE} --output-on-failure
